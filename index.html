<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Simulation</title>
  <link rel="stylesheet" href="styles/desktop.css">
</head>

<body>
  <main class="persona-login" id="loginScreen" aria-label="Choose laptop">
    <header class="login-status" aria-label="System status">
      <span class="apple-dot"></span>
      <div>
        <span class="wifi-status">
          <svg class="wifi-icon" viewBox="0 0 32 24" aria-label="Wi-Fi" role="img">
            <path d="M3.5 8.8Q16 -1 28.5 8.8"></path>
            <path d="M8.1 12.6Q16 5.8 23.9 12.6"></path>
            <path d="M12.7 16.3Q16 12.9 19.3 16.3"></path>
            <circle cx="16" cy="20" r="1.35"></circle>
          </svg>
          <span>eduroam</span>
        </span>
        <span class="battery-status" aria-label="Battery 82%">
          <span class="battery-icon"><span></span></span>
          <span>82%</span>
        </span>
        <time id="loginClock">--:--</time>
      </div>
    </header>

    <section class="lock-clock" aria-label="Current time">
      <span id="loginDate">Monday, January 1</span>
      <time id="loginBigTime">--:--</time>
    </section>

    <canvas class="qiongqi-code-rain" id="qiongqiCodeRain" aria-hidden="true"></canvas>

    <section class="login-panel account-login">
      <div class="laptop-options" aria-label="Persona laptops">
        <button class="laptop-card account-card" data-laptop="guang">
          <span class="laptop-avatar">G</span>
          <span class="laptop-name">追光</span>
        </button>

        <button class="laptop-card account-card" data-laptop="shanhong">
          <span class="laptop-avatar">单</span>
          <span class="laptop-name">单鸿</span>
        </button>

        <button class="laptop-card account-card" data-laptop="ahe">
          <span class="laptop-avatar">禾</span>
          <span class="laptop-name">阿禾</span>
        </button>

        <button class="laptop-card account-card" data-laptop="qiongqi">
          <span class="laptop-avatar">穷</span>
          <span class="laptop-name">穷奇</span>
        </button>
      </div>

      <form class="password-panel is-hidden" id="passwordPanel" autocomplete="off">
        <span class="laptop-avatar" id="passwordAvatar">?</span>
        <strong id="passwordName">Account</strong>
        <div class="password-row">
          <input id="laptopPassword" type="password" inputmode="numeric" aria-label="Password" placeholder="输入密码">
          <button class="toggle-password" id="toggleLaptopPassword" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.6"></circle>
            </svg>
          </button>
          <button class="submit-password" type="submit">→</button>
        </div>
        <p class="password-error" id="passwordError" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main class="desktop is-hidden" id="desktopScreen" aria-label="Desktop">
    <header class="menu-bar">
      <div class="menu-left">
        <span class="apple-dot"></span>
        <strong id="activeLaptopName">追光的电脑</strong>
        <button class="switch-laptop" id="switchLaptop" type="button">Log Out</button>
      </div>
      <div class="menu-right">
        <span class="wifi-status">
          <svg class="wifi-icon" viewBox="0 0 32 24" aria-label="Wi-Fi" role="img">
            <path d="M3.5 8.8Q16 -1 28.5 8.8"></path>
            <path d="M8.1 12.6Q16 5.8 23.9 12.6"></path>
            <path d="M12.7 16.3Q16 12.9 19.3 16.3"></path>
            <circle cx="16" cy="20" r="1.35"></circle>
          </svg>
          <span>eduroam</span>
        </span>
        <span class="battery-status" aria-label="Battery 82%">
          <span class="battery-icon"><span></span></span>
          <span>82%</span>
        </span>
        <time id="clock">--:--</time>
      </div>
    </header>

    <section class="desktop-icons" id="desktopIcons" aria-label="Applications"></section>
    <aside class="desktop-note is-hidden" id="desktopNote" aria-label="Desktop note"></aside>

    <section class="window is-hidden" id="appWindow" aria-live="polite">
      <header class="window-bar" id="windowBar">
        <div class="traffic">
          <button class="traffic-btn close" id="closeWindow" aria-label="Close"></button>
          <button class="traffic-btn minimize" id="minimizeWindow" aria-label="Minimize"></button>
          <button class="traffic-btn zoom" id="maximizeWindow" aria-label="Maximize"></button>
        </div>
        <div class="window-title" id="windowTitle">Application</div>
        <button class="window-translate is-hidden" id="translateWindow" type="button" aria-label="Translate window to English" title="Translate to English">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h9"></path>
            <path d="M9 3v2"></path>
            <path d="M10.7 5c-.8 3-2.6 5.8-5.2 8"></path>
            <path d="M5.2 8.4c1.2 1.9 2.8 3.4 4.8 4.6"></path>
            <path d="M13 21l4.5-10 4.5 10"></path>
            <path d="M14.3 18h6.4"></path>
          </svg>
        </button>
      </header>
      <iframe class="app-frame" id="appFrame" title="Application window"></iframe>
      <div class="resize-handle resize-handle-n" data-resize-handle="n" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-s" data-resize-handle="s" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-w" data-resize-handle="w" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-e" data-resize-handle="e" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-nw" data-resize-handle="nw" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-ne" data-resize-handle="ne" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-sw" data-resize-handle="sw" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-se" data-resize-handle="se" aria-hidden="true"></div>
    </section>

    <section class="window floating-window is-hidden" id="detailWindow" aria-live="polite">
      <header class="window-bar" id="detailWindowBar">
        <div class="traffic">
          <button class="traffic-btn close" id="closeDetailWindow" aria-label="Close"></button>
          <button class="traffic-btn minimize" id="minimizeDetailWindow" aria-label="Minimize"></button>
          <button class="traffic-btn zoom" id="maximizeDetailWindow" aria-label="Maximize"></button>
        </div>
        <div class="window-title" id="detailWindowTitle">Details</div>
        <button class="window-translate is-hidden" id="translateDetailWindow" type="button" aria-label="Translate window to English" title="Translate to English">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h9"></path>
            <path d="M9 3v2"></path>
            <path d="M10.7 5c-.8 3-2.6 5.8-5.2 8"></path>
            <path d="M5.2 8.4c1.2 1.9 2.8 3.4 4.8 4.6"></path>
            <path d="M13 21l4.5-10 4.5 10"></path>
            <path d="M14.3 18h6.4"></path>
          </svg>
        </button>
      </header>
      <iframe class="app-frame" id="detailFrame" title="Detail window"></iframe>
      <div class="resize-handle resize-handle-n" data-resize-handle="n" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-s" data-resize-handle="s" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-w" data-resize-handle="w" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-e" data-resize-handle="e" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-nw" data-resize-handle="nw" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-ne" data-resize-handle="ne" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-sw" data-resize-handle="sw" aria-hidden="true"></div>
      <div class="resize-handle resize-handle-se" data-resize-handle="se" aria-hidden="true"></div>
    </section>

    <div class="dock-reveal-zone" id="dockRevealZone" aria-hidden="true"></div>
    <nav class="dock" id="dock" aria-label="Dock"></nav>
  </main>

  <button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Enter full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 3H3v5"></path>
      <path d="M16 3h5v5"></path>
      <path d="M21 16v5h-5"></path>
      <path d="M8 21H3v-5"></path>
    </svg>
  </button>

  <section class="security-lock is-hidden" id="securityLock" aria-label="Admin password required" aria-modal="true" role="dialog">
    <form class="security-card" id="securityForm" autocomplete="off">
      <span class="security-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      </span>
      <strong>Admin Password</strong>
      <div class="security-row">
        <input id="adminPasswordInput" type="password" inputmode="numeric" aria-label="Admin Password" placeholder="Password">
        <button type="submit">→</button>
      </div>
      <p id="securityError" aria-live="polite"></p>
    </form>
  </section>

  <script src="scripts/desktop.js"></script>
</body>

</html>
