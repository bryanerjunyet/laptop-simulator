<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="../styles/empty-gallery.css">
</head>

<body>
  <main class="gallery-app">
    <aside class="gallery-side">
      <strong>Gallery</strong>
      <button class="active" type="button" data-gallery-tab="library">Library</button>
      <button type="button" data-gallery-tab="albums">Albums</button>
      <button type="button" data-gallery-tab="imports">Imports</button>
    </aside>
    <section class="gallery-empty" id="galleryPage">
      <h1>No Photos</h1>
      <p>The gallery library is empty.</p>
    </section>
  </main>

  <script src="../scripts/empty-gallery.js"></script>
</body>

</html>
