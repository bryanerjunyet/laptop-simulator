<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp</title>
  <link rel="stylesheet" href="../styles/whatsapp.css">
</head>

<body>
  <main class="whatsapp-app">
    <aside class="chat-list">
      <header class="list-header">
        <div class="avatar self">你</div>
        <span>Chats</span>
      </header>
      <div class="search">Search or start new chat</div>
      <div id="contacts"></div>
    </aside>
    <section class="chat-panel">
      <header class="chat-header" id="chatHeader"></header>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <button class="attach-btn" type="button" aria-label="Attach">+</button>
        <textarea id="messageInput" rows="1" placeholder="Message"></textarea>
        <button class="send-btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="../scripts/whatsapp.js"></script>
</body>

</html>
