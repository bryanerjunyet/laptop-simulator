<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome</title>
  <link rel="stylesheet" href="../styles/mock-chrome.css">
</head>

<body>
  <main class="chrome-app">
    <header class="chrome-top">
      <section class="tab-strip">
        <nav class="tabs" id="tabs" aria-label="Browser tabs"></nav>
        <button class="new-tab" id="newTabButton" type="button" aria-label="New tab">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
        </button>
      </section>

      <section class="toolbar">
        <div class="nav-controls">
          <button type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <button type="button" aria-label="Forward">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <button id="reloadButton" type="button" aria-label="Reload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.8 8.8a7 7 0 1 0 1 5.6"></path>
              <path d="M18.8 8.8h-4.5"></path>
              <path d="M18.8 8.8V4.3"></path>
            </svg>
          </button>
        </div>
        <form class="search-bar" id="searchForm">
          <svg class="search-leading" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="Search Google or type a URL" autocomplete="off">
        </form>
        <button class="toolbar-icon" type="button" aria-label="Extensions">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4h8v5h4v7h-5v4H8v-4H4V9h4z"></path>
          </svg>
        </button>
        <button class="profile-button" id="profileButton" type="button" aria-label="Chrome profile">单</button>
        <div class="profile-menu is-hidden" id="profileMenu">
          <div class="profile-card">
            <span class="profile-avatar" id="profileAvatar">单</span>
            <strong id="profileName">单鸿</strong>
            <small id="profileEmail">shanhong@wusha-studio.com</small>
          </div>
          <button type="button">Manage your Google Account</button>
          <button type="button">Passwords and autofill</button>
          <button type="button">Chrome settings</button>
          <button type="button">Sync is off</button>
        </div>
      </section>
    </header>

    <section class="chrome-page" id="chromePage">
      <img class="google-mark" src="../assets/icons/google-brand.svg" alt="Google">
      <form class="home-search" id="homeSearchForm">
        <svg class="search-leading" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input id="homeSearchInput" type="search" placeholder="Search Google or type a URL" autocomplete="off">
      </form>
      <div class="shortcut-row" aria-label="Shortcuts">
        <button id="googleShortcut" type="button">
          <span><img src="../assets/icons/google.svg" alt=""></span>
          <strong>Google</strong>
        </button>
        <button id="mailShortcut" type="button">
          <span><img src="../assets/icons/gmail.png" alt=""></span>
          <strong>Mail</strong>
        </button>
        <button id="addShortcut" type="button">
          <span class="plus-shortcut">+</span>
          <strong>Add</strong>
        </button>
      </div>
      <p id="searchMessage"></p>
    </section>
  </main>

  <script src="../scripts/mock-chrome.js"></script>
</body>

</html>
