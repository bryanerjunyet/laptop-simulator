<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail</title>
  <link rel="stylesheet" href="../styles/gmail.css">
</head>

<body>
  <main class="gmail-app">
    <header class="gmail-header">
      <button class="gmail-menu-button" id="gmailMenuButton" type="button" aria-label="Main menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 17h16"></path>
        </svg>
      </button>
      <div class="gmail-brand">
        <img src="../assets/icons/gmail.png" alt="">
        <span>Gmail</span>
      </div>
      <form class="gmail-search" id="gmailSearchForm">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input id="mailSearchInput" type="search" placeholder="Search mail">
      </form>
      <button class="gmail-profile" id="gmailProfileButton" type="button" aria-label="Gmail profile">禾</button>
      <div class="gmail-profile-menu is-hidden" id="gmailProfileMenu">
        <strong>阿禾</strong>
        <small>ahe@oldstudio.mail</small>
        <button type="button">Manage account</button>
        <button type="button">Mail settings</button>
        <button type="button">Storage</button>
        <button type="button">Sign out</button>
      </div>
    </header>
    <aside class="sidebar">
      <button class="compose" data-folder="compose"><span class="compose-plus" aria-hidden="true">+</span><span class="compose-label">Compose</span></button>
      <button class="folder active" data-folder="inbox"><span class="folder-label"><i class="folder-icon inbox"></i><span>Inbox</span></span></button>
      <button class="folder" data-folder="sent"><span class="folder-label"><i class="folder-icon sent"></i><span>Sent</span></span></button>
      <button class="folder" data-folder="drafts"><span class="folder-label"><i class="folder-icon drafts"></i><span>Drafts</span></span></button>
      <button class="folder" data-folder="trash"><span class="folder-label"><i class="folder-icon trash"></i><span>Trash</span></span></button>
    </aside>
    <section class="mail-list-panel">
      <div class="mail-toolbar">
        <div class="mail-actions">
          <button class="toolbar-checkbox-button" type="button" aria-label="Select all"><span class="toolbar-checkbox"></span></button>
          <button type="button" aria-label="Refresh">
            <svg class="toolbar-refresh" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.8 8.8a7 7 0 1 0 1 5.6"></path>
              <path d="M18.8 8.8h-4.5"></path>
              <path d="M18.8 8.8V4.3"></path>
            </svg>
          </button>
          <div class="mail-more-wrap">
            <button id="mailMoreButton" type="button" aria-label="More"><span class="toolbar-more"></span></button>
            <div class="mail-more-menu is-hidden" id="mailMoreMenu">
              <button type="button">Mark all as read</button>
              <button type="button">Filter messages</button>
              <button type="button">Print</button>
              <button type="button">Report spam</button>
            </div>
          </div>
        </div>
        <span>0-0 of 0</span>
      </div>
      <section class="mail-list" id="mailList"></section>
    </section>
    <article class="reader" id="reader"></article>
  </main>

  <script src="../scripts/empty-gmail.js"></script>
</body>

</html>
